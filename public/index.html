<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat with your PDF</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #1a1d24;
        --muted: #6b7280;
        --line: #e6e8ec;
        --accent: #6366f1;
        --accent-600: #4f46e5;
        --accent-soft: #eef0fe;
        --user: #6366f1;
        --ok: #16a34a;
        --err: #dc2626;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
      }
      .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

      /* ---------- Sidebar ---------- */
      .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
      .brand .logo {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        display: grid; place-items: center; color: #fff; font-size: 18px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      }
      .brand h1 { font-size: 15px; margin: 0; font-weight: 650; }
      .brand p { font-size: 12px; margin: 0; color: var(--muted); }

      .side-scroll { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }

      .sec-head {
        display: flex; align-items: center; justify-content: space-between;
        margin: 22px 4px 8px; font-size: 12px; font-weight: 650;
        letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
      }
      .sec-head.first { margin-top: 4px; }
      .icon-btn {
        border: 0; background: var(--accent-soft); color: var(--accent-600); cursor: pointer;
        font-size: 12px; text-transform: none; letter-spacing: 0; padding: 4px 10px; border-radius: 7px; font-weight: 600;
      }
      .icon-btn:hover { background: #e0e3fd; }
      .clear-btn {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        font-size: 12px; text-transform: none; letter-spacing: 0; padding: 2px 4px; border-radius: 6px;
      }
      .clear-btn:hover { color: var(--err); background: #fef2f2; }

      /* Conversations */
      .conv { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 3px; }
      .conv:hover { background: #f3f4f6; }
      .conv.active { background: var(--accent-soft); }
      .conv .c-title { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv .c-rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 6px; opacity: 0; }
      .conv:hover .c-rm { opacity: 1; }
      .conv .c-rm:hover { color: var(--err); background: #fef2f2; }
      .empty-mini { font-size: 12.5px; color: var(--muted); padding: 8px 6px; }

      /* Dropzone + upload tray */
      .dropzone {
        border: 1.5px dashed #cdd2dc; border-radius: var(--radius);
        padding: 20px 14px; text-align: center; cursor: pointer;
        transition: all 0.15s ease; background: #fafbfc; color: var(--muted);
      }
      .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-600); }
      .dropzone .up-ico { font-size: 22px; }
      .dropzone strong { color: var(--ink); display: block; margin-top: 4px; font-size: 14px; }
      .dropzone span { font-size: 12px; }

      .up-tray { margin-top: 8px; }
      .up-row { font-size: 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 6px; background: #fff; animation: pop 0.18s ease; }
      .up-top { display: flex; justify-content: space-between; gap: 8px; }
      .up-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
      .up-stat { color: var(--muted); flex-shrink: 0; }
      .up-row.ok .up-stat { color: #15803d; }
      .up-row.err .up-stat { color: var(--err); }
      .bar { height: 5px; border-radius: 999px; background: #eceef2; margin-top: 6px; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.15s; }
      .up-row.ok .bar > i { background: var(--ok); }
      .up-row.err .bar { display: none; }
      .bar.indet > i { width: 40%; animation: indet 1.1s infinite ease-in-out; }
      @keyframes indet { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

      /* Documents */
      .doc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; margin-bottom: 8px; background: #fff; animation: pop 0.18s ease; }
      .doc .file-ico { font-size: 16px; }
      .doc .meta { flex: 1; min-width: 0; }
      .doc .name { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .doc .sub { font-size: 11.5px; color: var(--muted); }
      .doc .rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
      .doc .rm:hover { color: var(--err); background: #fef2f2; }
      .empty-docs { font-size: 13px; color: var(--muted); text-align: center; padding: 14px 8px; }

      /* ---------- Chat ---------- */
      .chat { display: flex; flex-direction: column; min-height: 0; }
      .chat-head { padding: 16px 26px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .chat-head h2 { margin: 0; font-size: 16px; }
      .chat-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

      .messages { flex: 1; overflow-y: auto; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
      .empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 400px; }
      .empty-state .big { font-size: 40px; }
      .empty-state h3 { color: var(--ink); margin: 12px 0 6px; }
      .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
      .suggest button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--ink); transition: 0.15s; }
      .suggest button:hover { border-color: var(--accent); color: var(--accent-600); background: var(--accent-soft); }

      .msg { display: flex; gap: 12px; max-width: 780px; animation: pop 0.2s ease; }
      .msg.user { align-self: flex-end; flex-direction: row-reverse; }
      .msg .content { min-width: 0; }
      .avatar { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-size: 15px; }
      .msg.user .avatar { background: var(--user); color: #fff; }
      .msg.bot .avatar { background: var(--accent-soft); color: var(--accent-600); }
      .bubble { padding: 11px 15px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 5px; }
      .msg.bot .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; box-shadow: var(--shadow); }

      /* Citations with snippets */
      .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
      .source-card { border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; padding: 8px 11px; }
      .src-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-600); border: 1px solid #dfe2fd; }
      .jump { font-size: 11.5px; color: var(--accent-600); text-decoration: none; font-weight: 600; }
      .jump:hover { text-decoration: underline; }
      .snippet { margin-top: 7px; font-size: 12px; color: #475067; line-height: 1.5; white-space: pre-wrap; cursor: pointer; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
      .snippet.expanded { -webkit-line-clamp: unset; line-clamp: unset; }
      .snippet:hover { color: var(--ink); }

      .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); margin-left: 2px; border-radius: 1px; animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
      .dots span { animation: blink 1.2s infinite; } .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}

      /* ---------- Composer ---------- */
      .composer { padding: 16px 26px 22px; border-top: 1px solid var(--line); background: var(--panel); }
      .composer .box { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 8px 14px; background: #fff; transition: 0.15s; }
      .composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .composer textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; max-height: 160px; background: transparent; color: var(--ink); }
      .send { border: 0; background: var(--accent); color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 17px; flex-shrink: 0; transition: 0.15s; }
      .send:hover { background: var(--accent-600); }
      .send:disabled { opacity: 0.45; cursor: not-allowed; }
      .hint { font-size: 11.5px; color: var(--muted); margin: 8px 4px 0; text-align: center; }

      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }

      @media (max-width: 760px) {
        .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .sidebar { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">📄</div>
          <div>
            <h1>Chat with your PDF</h1>
            <p>Local RAG · Ollama</p>
          </div>
        </div>
        <div class="side-scroll">
          <div class="sec-head first">
            <span>Chats</span>
            <button class="icon-btn" id="newChatBtn">+ New</button>
          </div>
          <div id="convList"></div>

          <div class="sec-head">
            <span>Documents</span>
            <button class="clear-btn" id="clearBtn" hidden>Clear all</button>
          </div>
          <div class="dropzone" id="dropzone">
            <div class="up-ico">⬆️</div>
            <strong>Upload files</strong>
            <span>PDF, DOCX, TXT, MD — drag &amp; drop or click</span>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" multiple hidden />
          </div>
          <div class="up-tray" id="uploadTray"></div>
          <div id="docList"></div>
        </div>
      </aside>

      <!-- Chat -->
      <main class="chat">
        <div class="chat-head">
          <h2>Ask your documents</h2>
          <p>Answers are grounded only in the files you upload — with snippets &amp; page citations.</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div class="box">
            <textarea id="input" rows="1" placeholder="Ask a question about your documents…"></textarea>
            <button class="send" id="sendBtn" title="Send">➤</button>
          </div>
          <div class="hint">Enter to send · Shift+Enter for a new line</div>
        </div>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const messages = $("messages");
      const input = $("input");
      const sendBtn = $("sendBtn");
      const dropzone = $("dropzone");
      const fileInput = $("fileInput");
      const docListEl = $("docList");
      const clearBtn = $("clearBtn");
      const uploadTray = $("uploadTray");
      const convListEl = $("convList");
      const newChatBtn = $("newChatBtn");
      let busy = false;
      let docCount = 0;
      let currentConversationId = null;

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // ---------- Documents ----------
      async function loadDocuments() {
        try {
          const r = await fetch("/api/documents");
          renderDocuments((await r.json()).documents || []);
        } catch {}
      }
      function renderDocuments(docs) {
        docCount = docs.length;
        clearBtn.hidden = docs.length === 0;
        if (!docs.length) {
          docListEl.innerHTML = '<div class="empty-docs">No documents yet.<br />Upload a file to begin.</div>';
          renderEmptyState();
          return;
        }
        docListEl.innerHTML = docs
          .map((d) => {
            const pagePart = d.pages > 0 ? `${d.pages} page${d.pages === 1 ? "" : "s"} · ` : "";
            return `
          <div class="doc">
            <span class="file-ico">📄</span>
            <div class="meta">
              <div class="name" title="${esc(d.name)}">${esc(d.name)}</div>
              <div class="sub">${pagePart}${d.chunks} chunk${d.chunks === 1 ? "" : "s"}</div>
            </div>
            <button class="rm" title="Remove" data-id="${esc(d.id)}">×</button>
          </div>`;
          })
          .join("");
        docListEl.querySelectorAll(".rm").forEach((b) =>
          b.addEventListener("click", () => removeDoc(b.dataset.id))
        );
        if (!messages.querySelector(".msg")) renderEmptyState();
      }
      async function removeDoc(id) {
        const r = await fetch("/api/documents/" + encodeURIComponent(id), { method: "DELETE" });
        renderDocuments((await r.json()).documents || []);
      }
      clearBtn.addEventListener("click", async () => {
        if (!confirm("Remove all indexed documents?")) return;
        const r = await fetch("/api/documents/clear", { method: "POST" });
        renderDocuments((await r.json()).documents || []);
      });

      // ---------- Conversations ----------
      async function loadConversations() {
        try {
          const r = await fetch("/api/conversations");
          renderConversations((await r.json()).conversations || []);
        } catch {}
      }
      function renderConversations(list) {
        if (!list.length) {
          convListEl.innerHTML = '<div class="empty-mini">No chats yet — ask a question to start one.</div>';
          return;
        }
        convListEl.innerHTML = list
          .map(
            (c) => `
          <div class="conv${c.id === currentConversationId ? " active" : ""}" data-id="${esc(c.id)}">
            <div class="c-title" title="${esc(c.title)}">${esc(c.title)}</div>
            <button class="c-rm" title="Delete chat" data-id="${esc(c.id)}">×</button>
          </div>`
          )
          .join("");
        convListEl.querySelectorAll(".conv").forEach((el) =>
          el.addEventListener("click", (e) => {
            if (e.target.classList.contains("c-rm")) return;
            openConversation(el.dataset.id);
          })
        );
        convListEl.querySelectorAll(".c-rm").forEach((b) =>
          b.addEventListener("click", (e) => { e.stopPropagation(); deleteConversation(b.dataset.id); })
        );
      }
      function highlightActiveConv() {
        convListEl.querySelectorAll(".conv").forEach((el) =>
          el.classList.toggle("active", el.dataset.id === currentConversationId)
        );
      }
      async function openConversation(id) {
        try {
          const r = await fetch("/api/conversations/" + encodeURIComponent(id));
          if (!r.ok) return;
          const conv = (await r.json()).conversation;
          currentConversationId = id;
          messages.innerHTML = "";
          for (const m of conv.messages) {
            const el = addMessage(m.role === "user" ? "user" : "bot", esc(m.content));
            if (m.role !== "user" && m.sources && m.sources.length) {
              el.querySelector(".content").appendChild(renderSources(m.sources));
            }
          }
          if (!conv.messages.length) renderEmptyState();
          highlightActiveConv();
          messages.scrollTop = messages.scrollHeight;
        } catch {}
      }
      function newChat() {
        currentConversationId = null;
        messages.innerHTML = "";
        renderEmptyState();
        highlightActiveConv();
        input.focus();
      }
      async function deleteConversation(id) {
        const r = await fetch("/api/conversations/" + encodeURIComponent(id), { method: "DELETE" });
        const list = (await r.json()).conversations || [];
        if (id === currentConversationId) newChat();
        renderConversations(list);
      }
      newChatBtn.addEventListener("click", newChat);

      // ---------- Upload (per-file progress via XHR) ----------
      dropzone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => { uploadFiles(fileInput.files); fileInput.value = ""; });
      ["dragover", "dragenter"].forEach((e) =>
        dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.add("drag"); })
      );
      ["dragleave", "drop"].forEach((e) =>
        dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.remove("drag"); })
      );
      dropzone.addEventListener("drop", (ev) => uploadFiles(ev.dataTransfer.files));

      function addUploadRow(name) {
        const el = document.createElement("div");
        el.className = "up-row";
        el.innerHTML =
          `<div class="up-top"><span class="up-name">${esc(name)}</span><span class="up-stat">Queued</span></div><div class="bar"><i></i></div>`;
        uploadTray.appendChild(el);
        return el;
      }
      function setRow(el, state, opts = {}) {
        const stat = el.querySelector(".up-stat");
        const bar = el.querySelector(".bar");
        const fill = el.querySelector(".bar > i");
        el.classList.remove("ok", "err");
        bar.classList.remove("indet");
        if (state === "uploading") {
          stat.textContent = "Uploading " + Math.round(opts.percent || 0) + "%";
          fill.style.width = (opts.percent || 0) + "%";
        } else if (state === "indexing") {
          stat.textContent = "Indexing…"; fill.style.width = "100%"; bar.classList.add("indet");
        } else if (state === "done") {
          el.classList.add("ok"); stat.textContent = "Done · " + (opts.chunks || 0) + " chunks"; fill.style.width = "100%";
        } else if (state === "error") {
          el.classList.add("err"); stat.textContent = opts.error || "Failed";
        }
      }
      function uploadOne(file) {
        return new Promise((resolve) => {
          const row = addUploadRow(file.name);
          setRow(row, "uploading", { percent: 0 });
          const fd = new FormData();
          fd.append("files", file);
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/upload");
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) setRow(row, "uploading", { percent: (e.loaded / e.total) * 100 });
          };
          xhr.upload.onload = () => setRow(row, "indexing");
          xhr.onload = () => {
            try {
              const data = JSON.parse(xhr.responseText);
              const res = (data.results || [])[0] || {};
              if (res.error) setRow(row, "error", { error: res.error });
              else setRow(row, "done", { chunks: res.chunks });
              if (data.documents) renderDocuments(data.documents);
            } catch { setRow(row, "error", { error: "Bad response" }); }
            if (row.classList.contains("ok")) setTimeout(() => row.remove(), 4000);
            resolve();
          };
          xhr.onerror = () => { setRow(row, "error", { error: "Network error" }); resolve(); };
          xhr.send(fd);
        });
      }
      async function uploadFiles(fileList) {
        const accepted = [];
        for (const f of [...fileList]) {
          if (/\.(pdf|docx|txt|md)$/i.test(f.name)) accepted.push(f);
          else { const row = addUploadRow(f.name); setRow(row, "error", { error: "Unsupported type" }); setTimeout(() => row.remove(), 4000); }
        }
        for (const f of accepted) await uploadOne(f); // sequential: clean progress + bounded load
      }

      // ---------- Chat ----------
      function renderEmptyState() {
        if (messages.querySelector(".msg")) return;
        const tips = docCount
          ? ["Summarize the documents", "What are the key points?", "What does it say about deadlines?"]
          : [];
        messages.innerHTML = `
          <div class="empty-state">
            <div class="big">💬</div>
            <h3>${docCount ? "Ask anything about your documents" : "Upload a file to get started"}</h3>
            <p>${docCount ? "Each answer is grounded in your files and shows the snippet and page it came from." : "Drag a PDF, DOCX, TXT or MD file into the sidebar, then ask questions here."}</p>
            <div class="suggest">${tips.map((t) => `<button>${esc(t)}</button>`).join("")}</div>
          </div>`;
        messages.querySelectorAll(".suggest button").forEach((b) =>
          b.addEventListener("click", () => { input.value = b.textContent; send(); })
        );
      }

      function addMessage(role, html) {
        const empty = messages.querySelector(".empty-state");
        if (empty) empty.remove();
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.innerHTML =
          `<div class="avatar">${role === "user" ? "🧑" : "🤖"}</div><div class="content"><div class="bubble">${html}</div></div>`;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el;
      }

      // Render the structured citations (label chip + jump-to-page + expandable snippet).
      function renderSources(sources) {
        const wrap = document.createElement("div");
        wrap.className = "sources";
        wrap.innerHTML = sources
          .map((s) => {
            if (typeof s === "string") return `<div class="source-card"><div class="src-head"><span class="chip">${esc(s)}</span></div></div>`;
            const jump = s.fileUrl && s.page
              ? `<a class="jump" href="${esc(s.fileUrl)}#page=${s.page}" target="_blank" rel="noopener">jump to page ${s.page} ↗</a>`
              : "";
            const snip = s.snippet ? `<div class="snippet" title="Click to expand">${esc(s.snippet)}</div>` : "";
            return `<div class="source-card"><div class="src-head"><span class="chip">${esc(s.label)}</span>${jump}</div>${snip}</div>`;
          })
          .join("");
        wrap.querySelectorAll(".snippet").forEach((el) =>
          el.addEventListener("click", () => el.classList.toggle("expanded"))
        );
        return wrap;
      }

      async function send() {
        const q = input.value.trim();
        if (!q || busy) return;
        busy = true;
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";
        addMessage("user", esc(q));

        const botEl = addMessage("bot", '<span class="dots"><span>●</span><span>●</span><span>●</span></span>');
        const bubble = botEl.querySelector(".bubble");
        let answer = "";
        let started = false;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, conversationId: currentConversationId }),
          });
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop();
            for (const part of parts) {
              let event = "message";
              const dataLines = [];
              for (const line of part.split("\n")) {
                if (line.startsWith("event:")) event = line.slice(6).trim();
                else if (line.startsWith("data:")) dataLines.push(line.slice(5).replace(/^ /, ""));
              }
              const data = dataLines.join("\n"); // SSE: multi-line data joins with newlines
              if (event === "meta") {
                const m = JSON.parse(data);
                // Adopt whatever id the server resolved/created — even if we held a
                // stale one (e.g. the conversation was deleted in another tab).
                if (m.conversationId && m.conversationId !== currentConversationId) {
                  currentConversationId = m.conversationId;
                  loadConversations();
                }
              } else if (event === "token") {
                if (!started) { bubble.innerHTML = ""; started = true; }
                answer += JSON.parse(data).text;
                bubble.innerHTML = esc(answer) + '<span class="cursor"></span>';
                messages.scrollTop = messages.scrollHeight;
              } else if (event === "sources") {
                const srcs = JSON.parse(data);
                bubble.innerHTML = esc(answer);
                if (srcs.length) botEl.querySelector(".content").appendChild(renderSources(srcs));
              } else if (event === "error") {
                bubble.innerHTML = '<span style="color:var(--err)">⚠️ ' + esc(data) + "</span>";
              }
            }
          }
          if (!started && !answer) bubble.innerHTML = esc(answer || "(no response)");
        } catch (e) {
          bubble.innerHTML = '<span style="color:var(--err)">⚠️ Request failed. Is the server running?</span>';
        } finally {
          busy = false;
          sendBtn.disabled = false;
          input.focus();
          loadConversations(); // refresh titles + ordering (and surface a newly created chat)
          messages.scrollTop = messages.scrollHeight;
        }
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });

      loadDocuments();
      loadConversations();
    </script>
  </body>
</html>
