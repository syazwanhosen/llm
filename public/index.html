<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat with your PDF</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #1a1d24;
        --muted: #6b7280;
        --line: #e6e8ec;
        --accent: #6366f1;
        --accent-600: #4f46e5;
        --accent-soft: #eef0fe;
        --user: #6366f1;
        --ok: #16a34a;
        --err: #dc2626;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
      }
      .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

      /* ---------- Sidebar ---------- */
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .brand {
        display: flex; align-items: center; gap: 10px;
        padding: 18px 20px; border-bottom: 1px solid var(--line);
      }
      .brand .logo {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        display: grid; place-items: center; color: #fff; font-size: 18px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      }
      .brand h1 { font-size: 15px; margin: 0; font-weight: 650; }
      .brand p { font-size: 12px; margin: 0; color: var(--muted); }

      .side-scroll { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }

      .dropzone {
        border: 1.5px dashed #cdd2dc; border-radius: var(--radius);
        padding: 22px 14px; text-align: center; cursor: pointer;
        transition: all 0.15s ease; background: #fafbfc; color: var(--muted);
      }
      .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-600); }
      .dropzone .up-ico { font-size: 22px; }
      .dropzone strong { color: var(--ink); display: block; margin-top: 4px; font-size: 14px; }
      .dropzone span { font-size: 12px; }

      .docs-head {
        display: flex; align-items: center; justify-content: space-between;
        margin: 20px 4px 8px; font-size: 12px; font-weight: 650;
        letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
      }
      .clear-btn {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        font-size: 12px; text-transform: none; letter-spacing: 0; padding: 2px 4px; border-radius: 6px;
      }
      .clear-btn:hover { color: var(--err); background: #fef2f2; }

      .doc {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px;
        margin-bottom: 8px; background: #fff; animation: pop 0.18s ease;
      }
      .doc .file-ico { font-size: 16px; }
      .doc .meta { flex: 1; min-width: 0; }
      .doc .name { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .doc .sub { font-size: 11.5px; color: var(--muted); }
      .doc .rm {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 6px;
      }
      .doc .rm:hover { color: var(--err); background: #fef2f2; }
      .empty-docs { font-size: 13px; color: var(--muted); text-align: center; padding: 14px 8px; }

      .upload-status { margin-top: 6px; }
      .us-item { font-size: 12px; padding: 5px 10px; border-radius: 8px; margin-bottom: 6px; display: flex; gap: 6px; }
      .us-item.ok { background: #f0fdf4; color: #15803d; }
      .us-item.err { background: #fef2f2; color: var(--err); }
      .us-item.run { background: var(--accent-soft); color: var(--accent-600); }

      /* ---------- Chat ---------- */
      .chat { display: flex; flex-direction: column; min-height: 0; }
      .chat-head { padding: 16px 26px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .chat-head h2 { margin: 0; font-size: 16px; }
      .chat-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

      .messages { flex: 1; overflow-y: auto; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
      .empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 380px; }
      .empty-state .big { font-size: 40px; }
      .empty-state h3 { color: var(--ink); margin: 12px 0 6px; }
      .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
      .suggest button {
        border: 1px solid var(--line); background: #fff; border-radius: 999px;
        padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--ink); transition: 0.15s;
      }
      .suggest button:hover { border-color: var(--accent); color: var(--accent-600); background: var(--accent-soft); }

      .msg { display: flex; gap: 12px; max-width: 760px; animation: pop 0.2s ease; }
      .msg.user { align-self: flex-end; flex-direction: row-reverse; }
      .avatar { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-size: 15px; }
      .msg.user .avatar { background: var(--user); color: #fff; }
      .msg.bot .avatar { background: var(--accent-soft); color: var(--accent-600); }
      .bubble { padding: 11px 15px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 5px; }
      .msg.bot .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
      .sources { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent-600); border: 1px solid #dfe2fd;
      }
      .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); margin-left: 2px; border-radius: 1px; animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
      .dots span { animation: blink 1.2s infinite; } .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}

      /* ---------- Composer ---------- */
      .composer { padding: 16px 26px 22px; border-top: 1px solid var(--line); background: var(--panel); }
      .composer .box { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 8px 14px; background: #fff; transition: 0.15s; }
      .composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .composer textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; max-height: 160px; background: transparent; color: var(--ink); }
      .send { border: 0; background: var(--accent); color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 17px; flex-shrink: 0; transition: 0.15s; }
      .send:hover { background: var(--accent-600); }
      .send:disabled { opacity: 0.45; cursor: not-allowed; }
      .hint { font-size: 11.5px; color: var(--muted); margin: 8px 4px 0; text-align: center; }

      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }

      @media (max-width: 760px) {
        .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .sidebar { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">📄</div>
          <div>
            <h1>Chat with your PDF</h1>
            <p>Local RAG · Ollama</p>
          </div>
        </div>
        <div class="side-scroll">
          <div class="dropzone" id="dropzone">
            <div class="up-ico">⬆️</div>
            <strong>Upload PDFs</strong>
            <span>Drag &amp; drop or click — multiple files OK</span>
            <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
          </div>
          <div class="upload-status" id="uploadStatus"></div>

          <div class="docs-head">
            <span>Documents</span>
            <button class="clear-btn" id="clearBtn" hidden>Clear all</button>
          </div>
          <div id="docList"></div>
        </div>
      </aside>

      <!-- Chat -->
      <main class="chat">
        <div class="chat-head">
          <h2>Ask your documents</h2>
          <p>Answers are grounded only in the PDFs you upload — with page citations.</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div class="box">
            <textarea id="input" rows="1" placeholder="Ask a question about your PDFs…"></textarea>
            <button class="send" id="sendBtn" title="Send">➤</button>
          </div>
          <div class="hint">Enter to send · Shift+Enter for a new line</div>
        </div>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const messages = $("messages");
      const input = $("input");
      const sendBtn = $("sendBtn");
      const dropzone = $("dropzone");
      const fileInput = $("fileInput");
      const docListEl = $("docList");
      const clearBtn = $("clearBtn");
      const uploadStatus = $("uploadStatus");
      let busy = false;
      let docCount = 0;

      const esc = (s) =>
        s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // ---------- Documents ----------
      async function loadDocuments() {
        try {
          const r = await fetch("/api/documents");
          renderDocuments((await r.json()).documents || []);
        } catch {}
      }
      function renderDocuments(docs) {
        docCount = docs.length;
        clearBtn.hidden = docs.length === 0;
        if (!docs.length) {
          docListEl.innerHTML = '<div class="empty-docs">No documents yet.<br />Upload a PDF to begin.</div>';
          renderEmptyState();
          return;
        }
        docListEl.innerHTML = docs
          .map(
            (d) => `
          <div class="doc">
            <span class="file-ico">📄</span>
            <div class="meta">
              <div class="name" title="${esc(d.name)}">${esc(d.name)}</div>
              <div class="sub">${d.pages} page${d.pages === 1 ? "" : "s"} · ${d.chunks} chunk${d.chunks === 1 ? "" : "s"}</div>
            </div>
            <button class="rm" title="Remove" data-id="${esc(d.id)}">×</button>
          </div>`
          )
          .join("");
        docListEl.querySelectorAll(".rm").forEach((b) =>
          b.addEventListener("click", () => removeDoc(b.dataset.id))
        );
        if (!messages.querySelector(".msg")) renderEmptyState();
      }
      async function removeDoc(id) {
        const r = await fetch("/api/documents/" + encodeURIComponent(id), { method: "DELETE" });
        renderDocuments((await r.json()).documents || []);
      }
      clearBtn.addEventListener("click", async () => {
        if (!confirm("Remove all indexed documents?")) return;
        const r = await fetch("/api/documents/clear", { method: "POST" });
        renderDocuments((await r.json()).documents || []);
      });

      // ---------- Upload ----------
      dropzone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => { uploadFiles(fileInput.files); fileInput.value = ""; });
      ["dragover", "dragenter"].forEach((e) =>
        dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.add("drag"); })
      );
      ["dragleave", "drop"].forEach((e) =>
        dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.remove("drag"); })
      );
      dropzone.addEventListener("drop", (ev) => uploadFiles(ev.dataTransfer.files));

      async function uploadFiles(fileList) {
        const files = [...fileList].filter((f) => /\.pdf$/i.test(f.name));
        if (!files.length) return;
        const fd = new FormData();
        files.forEach((f) => fd.append("files", f));
        uploadStatus.innerHTML =
          '<div class="us-item run">⏳ Indexing ' + files.length + ' file' + (files.length > 1 ? "s" : "") + "…</div>";
        try {
          const r = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await r.json();
          uploadStatus.innerHTML = (data.results || [])
            .map((res) =>
              res.error
                ? `<div class="us-item err">⚠️ ${esc(res.name)} — ${esc(res.error)}</div>`
                : `<div class="us-item ok">✓ ${esc(res.name)} — ${res.chunks} chunks</div>`
            )
            .join("");
          renderDocuments(data.documents || []);
          setTimeout(() => (uploadStatus.innerHTML = ""), 6000);
        } catch (e) {
          uploadStatus.innerHTML = '<div class="us-item err">Upload failed.</div>';
        }
      }

      // ---------- Chat ----------
      function renderEmptyState() {
        if (messages.querySelector(".msg")) return;
        const tips = docCount
          ? ["Summarize the document", "What are the key points?", "What does it say about deadlines?"]
          : [];
        messages.innerHTML = `
          <div class="empty-state">
            <div class="big">💬</div>
            <h3>${docCount ? "Ask anything about your PDFs" : "Upload a PDF to get started"}</h3>
            <p>${docCount ? "Every answer is grounded in your documents and cites the page it came from." : "Drag a PDF into the sidebar, then ask questions here."}</p>
            <div class="suggest">${tips.map((t) => `<button>${esc(t)}</button>`).join("")}</div>
          </div>`;
        messages.querySelectorAll(".suggest button").forEach((b) =>
          b.addEventListener("click", () => { input.value = b.textContent; send(); })
        );
      }

      function addMessage(role, html) {
        const empty = messages.querySelector(".empty-state");
        if (empty) empty.remove();
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.innerHTML =
          `<div class="avatar">${role === "user" ? "🧑" : "🤖"}</div><div class="content"><div class="bubble">${html}</div></div>`;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el;
      }

      async function send() {
        const q = input.value.trim();
        if (!q || busy) return;
        busy = true;
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";
        addMessage("user", esc(q));

        const botEl = addMessage("bot", '<span class="dots"><span>●</span><span>●</span><span>●</span></span>');
        const bubble = botEl.querySelector(".bubble");
        let answer = "";
        let started = false;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q }),
          });
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop();
            for (const part of parts) {
              let event = "message", data = "";
              for (const line of part.split("\n")) {
                if (line.startsWith("event:")) event = line.slice(6).trim();
                else if (line.startsWith("data:")) data += line.slice(5).trim();
              }
              if (event === "token") {
                if (!started) { bubble.innerHTML = ""; started = true; }
                answer += JSON.parse(data).text;
                bubble.innerHTML = esc(answer) + '<span class="cursor"></span>';
                messages.scrollTop = messages.scrollHeight;
              } else if (event === "sources") {
                const srcs = JSON.parse(data);
                bubble.innerHTML = esc(answer);
                if (srcs.length) {
                  const wrap = document.createElement("div");
                  wrap.className = "sources";
                  wrap.innerHTML = srcs.map((s) => `<span class="chip">${esc(s)}</span>`).join("");
                  botEl.querySelector(".content").appendChild(wrap);
                }
              } else if (event === "error") {
                bubble.innerHTML = '<span style="color:var(--err)">⚠️ ' + esc(data) + "</span>";
              }
            }
          }
          if (!started && !answer) bubble.innerHTML = esc(answer || "(no response)");
        } catch (e) {
          bubble.innerHTML = '<span style="color:var(--err)">⚠️ Request failed. Is the server running?</span>';
        } finally {
          busy = false;
          sendBtn.disabled = false;
          input.focus();
          messages.scrollTop = messages.scrollHeight;
        }
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });

      loadDocuments();
    </script>
  </body>
</html>
